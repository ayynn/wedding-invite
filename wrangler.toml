# Cloudflare Workers 部署配置（静态资源 + Pages Functions 编译产物）
# 参考: https://developers.cloudflare.com/workers/static-assets/

name = "wedding-invite"
compatibility_date = "2025-06-01"
main = "./dist/_worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API / 图片墙走 Worker，其余交给静态资源（SPA）
run_worker_first = ["/api/*", "/wall/*"]

# ============================================================
# KV 命名空间（RSVP + 图片墙存储）
# ============================================================
[[kv_namespaces]]
binding = "WEDDING_KV"
id = "fe2f91ce659d459c9898b0436b82971e"
